name: Manual Deploy to VPS Dokploy (Manual Only)

# ==============================================================================
# WORKFLOW DE DESPLIEGUE MANUAL Y CONTROLADO
# ==============================================================================
# REQUISITOS OBLIGATORIOS ANTES DE EJECUTAR:
# 1. Migración de base de datos verificada y aplicada previamente (o runbook listo).
# 2. Respaldo consistente de SQLite (.backup) completado y verificado en el VPS.
# 3. Imagen inmutable compilada con tag de commit/SHA específico.
# 4. Autorización manual explícita del administrador.
# ==============================================================================

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "SHA del commit a desplegar (debe coincidir con la imagen inmutable)"
        required: true
        type: string
      confirmed_backup:
        description: "Confirmo que existe respaldo de base de datos SQLite verificado"
        required: true
        type: boolean
        default: false
      confirmed_migrations:
        description: "Confirmo que las migraciones correspondientes fueron ejecutadas/auditadas"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    name: Trigger Manual Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Validate Manual Confirmations
        run: |
          if [ "${{ inputs.confirmed_backup }}" != "true" ] || [ "${{ inputs.confirmed_migrations }}" != "true" ]; then
            echo "::error::El despliegue requiere confirmación explícita de respaldo y migraciones."
            exit 1
          fi
          echo "Despliegue manual autorizado para commit SHA: ${{ inputs.target_sha }}"

      - name: Trigger Dokploy compose redeploy
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
        run: |
          set -e
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_TOKEN" ] || [ -z "$COMPOSE_ID" ]; then
            echo "::error::Missing DOKPLOY_URL / DOKPLOY_TOKEN / DOKPLOY_COMPOSE_ID"
            exit 1
          fi
          echo "Calling compose.deploy on $DOKPLOY_URL for compose $COMPOSE_ID (SHA: ${{ inputs.target_sha }})"
          response=$(curl -sw "\n%{http_code}" -X POST \
            -H "x-api-key: $DOKPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"json\":{\"composeId\":\"$COMPOSE_ID\"}}" \
            "$DOKPLOY_URL/api/trpc/compose.deploy")
          body=$(echo "$response" | head -n -1)
          code=$(echo "$response" | tail -n 1)
          echo "HTTP $code"
          echo "$body"
          if [ "$code" != "200" ]; then
            echo "::error::Dokploy deploy trigger failed (HTTP $code)"
            exit 1
          fi
          echo "::notice::Deploy triggered. Watch Dokploy UI for rollout status."

      - name: Poll status (up to 5 min)
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
        run: |
          for i in $(seq 1 30); do
            status=$(curl -sf \
              -H "x-api-key: $DOKPLOY_TOKEN" \
              "$DOKPLOY_URL/api/trpc/compose.one?input=%7B%22json%22%3A%7B%22composeId%22%3A%22$COMPOSE_ID%22%7D%7D" \
              2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('result',{}).get('data',{}).get('json',{}).get('composeStatus','?'))" 2>/dev/null || echo "?")
            echo "Attempt $i: status=$status"
            case "$status" in
              done)           echo "::notice::Deploy completed successfully"; exit 0 ;;
              error)          echo "::error::Deploy reported error"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::warning::Status polling timeout"

