<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" style="background:#09090b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#18181b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#09090b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#991b1b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#grad1)"/>

  <!-- Top Navbar -->
  <rect width="1200" height="60" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="30" y="38" fill="#dc2626" font-size="20" font-weight="900" letter-spacing="2">VENDETTA LIVE MUSIC</text>
  <text x="260" y="36" fill="#a1a1aa" font-size="14">PANEL ADMINISTRATIVO</text>
  <rect x="1050" y="15" width="120" height="30" rx="6" fill="#27272a"/>
  <text x="1075" y="35" fill="#f4f4f5" font-size="12" font-weight="bold">Admin User</text>

  <!-- Left Sidebar -->
  <rect y="60" width="220" height="690" fill="#121215" stroke="#27272a" stroke-width="1"/>
  <text x="25" y="100" fill="#71717a" font-size="10" font-weight="bold" letter-spacing="1.5">MENÚ PRINCIPAL</text>
  
  <text x="25" y="135" fill="#f4f4f5" font-size="13" font-weight="600">📊 Dashboard</text>
  <text x="25" y="175" fill="#dc2626" font-size="13" font-weight="bold">💼 Centro de Ventas</text>
  <text x="25" y="215" fill="#f4f4f5" font-size="13" font-weight="600">📅 Agenda / Shows</text>
  <text x="25" y="255" fill="#f4f4f5" font-size="13" font-weight="600">👥 Clientes</text>
  <text x="25" y="295" fill="#f4f4f5" font-size="13" font-weight="600">📍 Locaciones</text>
  <text x="25" y="335" fill="#f4f4f5" font-size="13" font-weight="600">📦 Paquetes</text>
  <text x="25" y="375" fill="#f4f4f5" font-size="13" font-weight="600">💳 Pagos</text>
  <text x="25" y="415" fill="#f4f4f5" font-size="13" font-weight="600">💬 Inbox WhatsApp</text>
  <text x="25" y="455" fill="#f4f4f5" font-size="13" font-weight="600">⚙️ Configuración</text>

  <!-- Main Content Area -->
  <g transform="translate(250, 80)">
    <!-- Header Banner -->
    <rect width="920" height="70" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="25" y="35" fill="#f4f4f5" font-size="20" font-weight="bold">Catálogo de Locaciones: /admin/locaciones</text>
    <text x="25" y="55" fill="#a1a1aa" font-size="12">Módulo descriptivo auditado • Solo Lectura</text>

    <!-- Content Blocks -->
    <g transform="translate(0, 90)">

      <rect y="0" width="920" height="90" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <circle cx="35" cy="45" r="16" fill="#27272a"/>
      <text x="30" y="50" fill="#dc2626" font-size="14" font-weight="bold">1</text>
      <text x="70" y="40" fill="#f4f4f5" font-size="15" font-weight="bold">Lista de Venues, Salones y Domicilios</text>
      <text x="70" y="60" fill="#71717a" font-size="12">Estructura visible en la interfaz sin datos personales (Anonimizado)</text>

      <rect y="105" width="920" height="90" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <circle cx="35" cy="150" r="16" fill="#27272a"/>
      <text x="30" y="155" fill="#dc2626" font-size="14" font-weight="bold">2</text>
      <text x="70" y="145" fill="#f4f4f5" font-size="15" font-weight="bold">Ciudad, Estado, Enlace a Google Maps</text>
      <text x="70" y="165" fill="#71717a" font-size="12">Estructura visible en la interfaz sin datos personales (Anonimizado)</text>

      <rect y="210" width="920" height="90" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <circle cx="35" cy="255" r="16" fill="#27272a"/>
      <text x="30" y="260" fill="#dc2626" font-size="14" font-weight="bold">3</text>
      <text x="70" y="250" fill="#f4f4f5" font-size="15" font-weight="bold">Eventos Realizados en el Lugar</text>
      <text x="70" y="270" fill="#71717a" font-size="12">Estructura visible en la interfaz sin datos personales (Anonimizado)</text>

    </g>
  </g>
</svg>
